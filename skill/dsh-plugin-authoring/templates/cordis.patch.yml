# Profile-bundle patch; the package must declare dsh.bundle.patch for this layer.
# The top level is an array. Row order is configuration-layer order, not Service
# activation order; Cordis/Loader dependency waiting controls activation.
#
# - insert:
#     - id: my-plugin
#       name: dsh-my-plugin
#
# Insert into an existing group (the target id is the group; insert is an array):
# - id: web-app
#   insert:
#     - id: my-plugin
#       name: dsh-my-plugin
#
# Override an existing row (whole fields are replaced; no deep merge):
# - id: my-plugin
#   name: dsh-my-plugin
#   disabled: true
- insert:
    - id: my-plugin
      name: dsh-my-plugin
